# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve`. If you change this file, please restart the server process.

# Theme Settings
remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: "default" # "air", "aqua", "contrast", "dark", "dirt", "neon", "mint", "plum", "sunrise", "catppuccin_latte", "catppuccin_mocha"

# Site Settings
title: "Tshephang Makgaloa"
subtitle: "Software Developer | Java Enthusiast"
description: "Welcome to my portfolio - showcasing my projects and skills as a Computer Science student passionate about game development and Java."
url: "https://mastersflash19.github.io"
baseurl: ""
locale: "en-US"
direction: "ltr" # "ltr" (default), "rtl"
title_separator: "-"
name: "Tshephang Makgaloa"
repository: "mastersflash19/mastersflash19.github.io"
teaser: "/assets/images/teaser.jpg"
logo: "/assets/images/logo.png"
masthead_title: "Tshephang Makgaloa"
breadcrumbs: false
words_per_minute: 200
enable_copy_code_button: true
copyright: "Tshephang Makgaloa"
copyright_url: "https://mastersflash19.github.io"

# Comments (disable for now)
comments:
  provider: false

# Search
search: true
search_full_content: true
search_provider: lunr # lunr (default), algolia, google

# SEO Related
google_site_verification: 
bing_site_verification: 
naver_site_verification: 
yandex_site_verification: 
baidu_site_verification: 

# Social Sharing
twitter:
  username: 
facebook:
  username: 
  app_id: 
  publisher: 
og_image: "/assets/images/og-image.jpg"
og_image_alt: "Tshephang Makgaloa Portfolio"

# Social Profiles
social:
  type: Person
  name: Tshephang Makgaloa
  links:
    - "https://github.com/mastersflash19"
    - "https://linkedin.com/in/yourprofile"
    - "https://twitter.com/yourusername"

# Analytics (disable for now)
analytics:
  provider: false
  google:
    tracking_id: 
    anonymize_ip: false

# Site Author
author:
  name: "Tshephang Makgaloa"
  avatar: "/assets/images/avatar.jpg"
  bio: "Computer Science student passionate about game development, Java, and building engaging applications."
  location: "South Africa"
  email: "your.email@example.com"
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:your.email@example.com"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/mastersflash19"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://linkedin.com/in/yourprofile"
    - label: "Twitter"
      icon: "fab fa-fw fa-square-x-twitter"
      url: "https://twitter.com/yourusername"

# Site Footer
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/mastersflash19"
      rel: "me"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://linkedin.com/in/yourprofile"
      rel: "me"
    - label: "Twitter"
      icon: "fab fa-fw fa-square-x-twitter"
      url: "https://twitter.com/yourusername"
      rel: "me"
  since: "2024"

# Reading Files
include:
  - .htaccess
  - _pages
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - vendor
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/plugins
  - assets/js/_main.js
  - assets/js/vendor
  - Capfile
  - CHANGELOG
  - config
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - log
  - minimal-mistakes-jekyll.gemspec
  - node_modules
  - package.json
  - package-lock.json
  - Rakefile
  - README
  - tmp
  - /docs
  - /test
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed
  quiet_deps: true
  silence_deprecations: ['import']

# Outputting
permalink: /:categories/:title/
timezone: Africa/Johannesburg

# Pagination with jekyll-paginate
paginate: 5
paginate_path: /page:num/

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

# mimic GitHub Pages with --safe
whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

# Archives
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development

# Defaults
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
